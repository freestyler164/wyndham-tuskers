name: wyndham-tuskers-deploy

services:
  terraform:
    image: hashicorp/terraform:1.6.6
    working_dir: /workspace/infra/terraform
    volumes:
      - .:/workspace
      - ${USERPROFILE}/.aws:/root/.aws:ro
    environment:
      - AWS_PROFILE=${AWS_PROFILE:-default}
      - AWS_REGION=${AWS_REGION:-ap-southeast-2}
      - AWS_DEFAULT_REGION=${AWS_REGION:-ap-southeast-2}
    entrypoint: ["terraform"]

  terraform-pilot:
    image: hashicorp/terraform:1.6.6
    working_dir: /workspace/infra/terraform-pilot
    volumes:
      - .:/workspace
      - ${USERPROFILE}/.aws:/root/.aws:ro
    environment:
      - AWS_PROFILE=${AWS_PROFILE:-default}
      - AWS_REGION=${AWS_REGION:-ap-southeast-2}
      - AWS_DEFAULT_REGION=${AWS_REGION:-ap-southeast-2}
    entrypoint: ["terraform"]

  awscli:
    image: amazon/aws-cli:2.15.0
    working_dir: /workspace
    volumes:
      - .:/workspace
      - ${USERPROFILE}/.aws:/root/.aws:ro
    environment:
      - AWS_PROFILE=${AWS_PROFILE:-default}
      - AWS_REGION=${AWS_REGION:-ap-southeast-2}
      - AWS_DEFAULT_REGION=${AWS_REGION:-ap-southeast-2}
    entrypoint: ["aws"]

  node:
    image: node:22-alpine
    working_dir: /workspace
    volumes:
      - .:/workspace
      - ${USERPROFILE}/.aws:/root/.aws:ro
    environment:
      - AWS_PROFILE=${AWS_PROFILE:-default}
      - AWS_REGION=${AWS_REGION:-ap-southeast-2}
      - AWS_DEFAULT_REGION=${AWS_REGION:-ap-southeast-2}
    entrypoint: ["sh", "-lc"]
