server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    # Use a variable so nginx does not try to resolve the local Docker Compose
    # hostname during startup. In AWS, the ALB routes /api/* to the backend
    # before the request reaches this container.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream backend;
    proxy_pass http://$backend_upstream:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
