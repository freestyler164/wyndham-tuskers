services:
  localstack:
    image: localstack/localstack-pro:4.4.0
    container_name: wt-localstack
    ports:
      - "4566:4566"
      - "4510-4559:4510-4559"
    env_file:
      - .env.localstack
    environment:
      - SERVICES=apigateway,lambda,s3,cloudformation,cognito-idp,dynamodb,sts,iam,ses
      - DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - EDGE_PORT=4566
      - LAMBDA_EXECUTOR=docker-reuse
      - DEBUG=0
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4566/_localstack/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - ./local/localstack-init:/etc/localstack/init/ready.d
      - //var/run/docker.sock:/var/run/docker.sock
      - .:/workspace
      - localstack_data:/var/lib/localstack

  backend:
    container_name: wt-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env.localstack
    environment:
      - NODE_ENV=development
      - PORT=4000
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_ENDPOINT=http://localstack:4566
      - USERS_TABLE=members
      - TOKENS_TABLE=password_reset_tokens
      - SURVEYS_TABLE=surveys
      - RESPONSES_TABLE=survey_responses
      - EVENTS_TABLE=events
      - NEWS_TABLE=news_posts
      - MARKETPLACE_TABLE=marketplace
      - GALLERY_TABLE=gallery
      - SETTINGS_TABLE=settings
      - PAINTING_COMPETITION_TABLE=painting_competition
      - PAINTING_SUBMISSIONS_TABLE=painting_submissions
      - ONAM_SCHEDULE_TABLE=onam_schedule
      - PAINTING_ASSETS_BUCKET=wt-local-painting-assets
      - MARKETPLACE_ASSETS_BUCKET=wt-local-marketplace-assets
      - GALLERY_ASSETS_BUCKET=wt-local-gallery-assets
      - ONAM_SCHEDULE_ASSETS_BUCKET=wt-local-onam-schedule-assets
      - FRONTEND_URL=http://localhost:3000
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - ENABLE_MEMBER_REGISTRATION=false
    ports:
      - 4000:4000
    depends_on:
      - localstack

  frontend:
    container_name: wt-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - 3000:80
    depends_on:
      - backend

  mytuskers-api:
    container_name: mytuskers-api
    build:
      context: ./apps/mytuskers-api
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development
      - PORT=4100
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_ENDPOINT=http://localstack:4566
      - MYTUSKERS_CORE_TABLE=mytuskers-core
      - MYTUSKERS_FINANCE_TABLE=mytuskers-finance
      - MYTUSKERS_AUDIT_TABLE=mytuskers-audit
      - MYTUSKERS_RECEIPTS_BUCKET=mytuskers-local-receipts
      - MYTUSKERS_WEB_ORIGIN=http://localhost:3100
      - MYTUSKERS_JWT_SECRET=mytuskers-local-dev-secret
    ports:
      - 4100:4100
    depends_on:
      - localstack

  mytuskers-web:
    container_name: mytuskers-web
    build:
      context: ./apps/mytuskers-web
      dockerfile: Dockerfile
    environment:
      - VITE_MYTUSKERS_API_URL=http://localhost:4100
    ports:
      - 3100:3100
    depends_on:
      - mytuskers-api

volumes:
  localstack_data:
